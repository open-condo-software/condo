giterminismConfigVersion: 1
config:
  allowUncommitted: false
  goTemplateRendering:
    allowEnvVariables:
      - PULL_USER
      - PULL_PERSONAL_ACCESS_KEY
      - DOCKER_REGISTRY
      - TURBO_API
      - PREBUILT_APPS_IMAGE
  secrets:
    allowEnvVariables:
      - TURBO_TOKEN
  stapel:
    allowFromLatest: true
  dockerfile:
    allowContextAddFiles:
      - out
      - out/
