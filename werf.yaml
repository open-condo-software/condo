project: condo
configVersion: 1
---
# Intermediate: OS + Node/Python runtime (cached when Dockerfile base stage is unchanged)
image: apps-base
final: false
dockerfile: Dockerfile
target: base
args:
  REGISTRY: {{ env "DOCKER_REGISTRY" }}/doma/utils
---
# Intermediate: yarn install from pruned manifests only (cached when lockfiles/package.json unchanged)
image: apps-deps
final: false
dockerfile: Dockerfile
target: installer
contextAddFiles:
  - out/
args:
  REGISTRY: {{ env "DOCKER_REGISTRY" }}/doma/utils
---
# Final Node image used by all app/worker/migration pods
image: apps
dockerfile: Dockerfile
target: runtime
contextAddFiles:
  - out/
args:
  REGISTRY: {{ env "DOCKER_REGISTRY" }}/doma/utils
  TURBO_TEAM: condo-ci
  TURBO_REMOTE_ONLY: "true"
  TURBO_TOKEN: {{ env "TURBO_TOKEN" }}
  TURBO_API: {{ env "TURBO_API" }}
---
image: valkeyreview
from: valkey/valkey:8.0.2
---
image: preparepostgresreview
from: postgres:16.8
shell:
  install:
  - "apt update -qq"
  - "apt install -qq -y wget"
  - "wget https://obs-community-intl.obs.ap-southeast-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz"
  - "mkdir obsutil_linux_amd64 && tar -xf obsutil_linux_amd64.tar.gz -C obsutil_linux_amd64 --strip-components 1"
  - "cd obsutil_linux_amd64"
  - "chmod 755 obsutil"

docker:
  ENV:
    LANG: C.UTF-8
---
image: python-base
from: python:3.9-slim
shell:
  beforeInstall:
  - "export DEBIAN_FRONTEND=noninteractive"
  - "groupadd -r app --gid=999"
  - "useradd --system --create-home --home /app --gid 999 --uid=999 --shell /bin/bash app"
  - "apt update -qq"
  - "apt install -qq -y --no-install-recommends
      python3-pip
      python3-dev"

docker:
  ENV:
    LANG: C.UTF-8
---
image: classifiers_api
fromImage: python-base
fromCacheVersion: "5"
git:
  - add: /
    to: /app
    excludePaths:
      - .github
      - .helm
      - werf.yaml
      - werf-giterminism.yaml
    owner: app
    group: app

shell:
  install:
  - "cd /app/apps/classifiers-api"
  - "pip install -r requirements.txt"
  - "python bin/download_nltk_data.py --data-dir /app/apps/classifiers-api/nltk_data"
  - "chown -R app:app /app/apps/classifiers-api/nltk_data"

docker:
  ENV:
    LANG: C.UTF-8
    NLTK_DATA: /app/apps/classifiers-api/nltk_data
