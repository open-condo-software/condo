on:
  workflow_call:
    inputs:
      shard_index:
        required: true
        type: number
      shard_total:
        required: true
        type: number
      image_name:
        required: true
        type: string
      runs-on:
        required: false
        type: string
        default: ubuntu-latest

jobs:
  tests:
    runs-on: ${{ inputs.runs-on }}

    steps:
      - name: install docker-compose plugin
        uses: open-condo-software/actions-setup-docker-compose@v1
        with:
          version: v2.28.1
      - name: install deps
        run: |
          sudo apt update && sudo apt install -y git

      - name: Wait for dind to be ready
        run: |
          set -euo pipefail
          cert_dir=/certs/client
          deadline=$((SECONDS + 120))

          echo "Waiting for Docker TLS certs in ${cert_dir}"
          while true; do
            if [[ -f "${cert_dir}/ca.pem" && -f "${cert_dir}/cert.pem" && -f "${cert_dir}/key.pem" ]]; then
              echo "TLS certs are present"
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for Docker TLS certs in ${cert_dir}" >&2
              ls -la "${cert_dir}" >&2 || true
              exit 1
            fi
            sleep 1
          done

          echo "Waiting for Docker daemon to accept connections"
          while true; do
            if docker info >/dev/null 2>&1; then
              docker info
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for Docker daemon" >&2
              docker info >&2 || true
              exit 1
            fi
            sleep 1
          done

      - name: Login to registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.SBERCLOUD_CR_USERNAME }}
          password: ${{ secrets.SBERCLOUD_CR_PASSWORD }}

      - name: checkout code
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.SSH_DOCK_SERVER_PRIVATE_KEY }}
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: prepare env for dbs
        run: |
          cp .env.example .env

      - name: run dbs
        env:
          REGISTRY: ${{ secrets.DOCKER_REGISTRY }}/doma/utils/
        run: |
          docker-compose --profile dbs up -d
          docker-compose up -d --wait nats

      - name: run tests
        run: |
          mkdir test_logs
          chmod -R a+rw ./test_logs
          docker run \
          -e PROMETHEUS_RW_SERVER_URL=$PROMETHEUS_RW_SERVER_URL \
          -e PROMETHEUS_USER=$PROMETHEUS_USER \
          -e PROMETHEUS_PASSWORD=$PROMETHEUS_PASSWORD \
          -e GH_REF_NAME=$GH_REF_NAME \
          -v ./test_logs:/app/test_logs --network="host" \
          ${{ secrets.DOCKER_REGISTRY }}/${{ inputs.image_name }} \
          bash -c "./bin/run_condo_domain_tests.sh -s ${{ inputs.shard_index }} -t ${{ inputs.shard_total }}"
        env:
          PROMETHEUS_RW_SERVER_URL: ${{ secrets.K6_PROMETHEUS_RW_SERVER_URL }}
          PROMETHEUS_USER: ${{ secrets.K6_PROMETHEUS_USER }}
          PROMETHEUS_PASSWORD: ${{ secrets.K6_PROMETHEUS_PASSWORD }}
          GH_REF_NAME: ${{ github.head_ref || github.ref_name }}

      - name: Collect docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@v1
        with:
          dest: './docker-logs'

      - name: Upload log artifact
        uses: actions/upload-artifact@v4.6.2
        if: failure()
        with:
          name: logs-shard-${{ inputs.shard_index }}-of-${{ inputs.shard_total }}-${{ env.GITHUB_RUN_ID }}-${{ env.GITHUB_RUN_NUMBER }}
          path: |
            ./test_logs/*
            *.log
            ./docker-logs
          retention-days: 2
